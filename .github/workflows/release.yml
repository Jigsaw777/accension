name: Release artifacts
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      security-events: write
      packages: read
  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install build==1.6.1 pip-audit==2.10.1
    - run: python scripts/check_wheel.py
    - run: python -m pip install dist/*.whl
    - run: python -m pip_audit --format cyclonedx-json --output dist/sbom.json
    - run: sha256sum dist/* > checksums.sha256
    - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: dist/*
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: accension-v1-release-candidate
        path: 'dist/*

          checksums.sha256'
        retention-days: 30
    needs: checks
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: github.ref == 'refs/heads/main'
