name: CI
'on':
  push:
    branches: [main]
  pull_request: null
  workflow_call: null
  workflow_dispatch: null
  schedule:
  - cron: 23 4 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Code and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[test,dev]'
    - run: python -m ruff check src tests scripts examples/provider-plugin
    - run: python -m ruff format --check src tests scripts examples/provider-plugin
    - run: python scripts/scan_public.py
    - run: python scripts/security_policy.py
    - run: python scripts/check_docs.py
    - run: python -m bandit -r src scripts -ll -iii
    - run: node --check src/local_ai_router/static/app.js
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q --cov --cov-report=xml --cov-report=term:skip-covered
    - run: python -m pip install --no-deps ./examples/provider-plugin
    - run: python -m pytest -q examples/provider-plugin/tests
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - '3.11'
        - '3.12'
        - '3.13'
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        languages: ${{ matrix.language }}
        build-mode: none
    - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        category: /language:${{ matrix.language }}
        output: codeql-results
    - name: Block security alerts
      run: python scripts/check_codeql.py codeql-results
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript-typescript
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install --upgrade pip
    - run: python -m pip install -e '.[test,dev,azure,aws,google,vault]'
    - run: python -m pip_audit --skip-editable
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: moderate
    if: github.event_name == 'pull_request'
  secrets:
    name: Secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python scripts/install_security_tools.py
    - run: python scripts/secret_audit.py --self-test
    - name: Full history
      if: github.event_name != 'pull_request'
      run: python scripts/secret_audit.py
    - name: Pull request range
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python scripts/secret_audit.py --range "$BASE_SHA..$HEAD_SHA"
  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install zizmor==1.30.1
    - run: zizmor --offline --min-severity medium .github/workflows
  package:
    name: Wheel build and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install build==1.6.1
    - run: python scripts/check_wheel.py
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Require every mandatory check
      env:
        RESULTS: ${{ toJSON(needs) }}
        EVENT: ${{ github.event_name }}
      run: "python - <<'PY'\nimport json, os\njobs = json.loads(os.environ['RESULTS'])\nfailed = [name for name, item in jobs.items()\
        \ if item['result'] != 'success'\n          and not (name == 'dependency-review' and item['result'] == 'skipped'\n\
        \                   and os.environ['EVENT'] != 'pull_request')]\nprint('Required jobs:', {name: item['result'] for\
        \ name, item in jobs.items()})\nif failed:\n    raise SystemExit('Required checks failed or did not run: ' + ', '.join(failed))\n\
        PY\n"
    if: always()
    needs:
    - quality
    - test
    - codeql
    - dependencies
    - dependency-review
    - secrets
    - workflows
    - package
