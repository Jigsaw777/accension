[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accension"
version = "0.1.0"
description = "Local cost-aware model gateway and verified task DAG executor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Sourik Ganguly"}]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "mcp>=1.10,<2"]

[project.urls]
Repository = "https://github.com/Jigsaw777/accension"
Issues = "https://github.com/Jigsaw777/accension/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
azure = ["azure-identity>=1.19,<2"]

[project.scripts]
router = "local_ai_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

