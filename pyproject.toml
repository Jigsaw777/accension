[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accension"
dynamic = ["version"]
description = "Local AI execution compiler with portable plans, adaptive routing and execution receipts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Sourik Ganguly"}]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "mcp>=1.10,<2"]

[project.urls]
Repository = "https://github.com/Jigsaw777/accension"
Issues = "https://github.com/Jigsaw777/accension/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=7,<8"]
dev = ["ruff==0.16.10", "bandit==1.9.4", "pip-audit==2.10.1", "build==1.6.1", "zizmor==1.30.1"]
azure = ["azure-identity>=1.19,<2"]
aws = ["boto3>=1.40,<2"]
google = ["google-auth>=2.38,<3", "requests>=2.32,<3"]
vault = ["keyring>=25,<26"]

[project.scripts]
accs = "local_ai_router.cli:main"
router = "local_ai_router.cli:main"
accension = "local_ai_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "local_ai_router.__version__"}

[tool.setuptools.package-data]
local_ai_router = ["static/*.html", "static/*.css", "static/*.js", "data/prompts/*/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
tmp_path_retention_count = 1

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["local_ai_router"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80
